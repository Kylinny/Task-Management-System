services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: happyrobot
      POSTGRES_USER: happyrobot
      POSTGRES_PASSWORD: happyrobot
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
